apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment-one

spec:
  replicas: 2

  selector:
    matchLabels:
      app: mi-app

  template:
    metadata:
      labels:
        app: mi-app

    spec:
      containers:
        - name: mi-app-one
          image: giovanna94hdez/app-one:latest
